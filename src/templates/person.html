<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.Name}} — filmstock</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f1115;color:#e6e8ec}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 60px}
a.back{color:#5b8cff;text-decoration:none;font-size:14px}
.phead{display:flex;gap:18px;align-items:center;margin-top:14px}
.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;background:#20242e;flex:none}
.avatar.ph{display:flex;align-items:center;justify-content:center;font-size:44px}
h1{margin:0 0 2px;font-size:30px}
.count{color:#8a90a0;font-size:14px;margin-bottom:10px}
.role{margin:22px 0 8px;font-size:14px;letter-spacing:.5px;text-transform:uppercase;color:#8a90a0;
  border-bottom:1px solid #222834;padding-bottom:6px}
ul{list-style:none;padding:0;margin:0}
li a{display:flex;justify-content:space-between;gap:12px;padding:8px 10px;border-radius:8px;
  color:inherit;text-decoration:none;border:1px solid transparent}
li a:hover{background:#171a21;border-color:#2a2f3a}
.yr{color:#8a90a0;font-variant-numeric:tabular-nums}
.television-badge{font-size:10px;background:#2a3550;color:#9db4ff;border-radius:4px;padding:1px 5px;vertical-align:middle}
</style></head><body>
<div class="wrap">
<a class="back" href="/">← search</a>
<div class="phead">
  {{if .Image}}<img class="avatar" src="{{.Image}}" alt="{{.Name}}">{{else}}<div class="avatar ph">🎭</div>{{end}}
  <div>
    <h1>{{.Name}}</h1>
    <div class="count">{{range .Roles}}{{len .Movies}} {{.Role}}{{if gt (len .Movies) 1}}s{{end}} · {{end}}</div>
  </div>
</div>
{{range .Roles}}
  <div class="role">{{.Role}}</div>
  <ul>{{range .Movies}}<li><a href="{{if eq .Type "television"}}/television{{else}}/movie{{end}}?id={{.ID}}"><span>{{.Title}}{{if eq .Type "television"}} <span class="television-badge">Television</span>{{end}}</span><span class="yr">{{if .Year}}{{.Year}}{{end}}</span></a></li>{{end}}</ul>
{{end}}
</div>
</body></html>
